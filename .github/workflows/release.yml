name: Release

# Pushing a tag such as v1.0.0 builds Quadra.zip and publishes it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build Quadra.zip
        run: ./build.sh --zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Quadra.zip --title "Quadra $GITHUB_REF_NAME" --generate-notes
